name: Decision Model Evaluations

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate on the complete accepted decision bank
        type: choice
        default: none
        options:
          - none
          - all
          - jev
          - drex2
          - clefomni
          - mercurydecide
          - liquidd1
          - microsoftdecision1
          - decider11
          - solardecideflash
          - classify1
          - luna6
          - sol61
          - opus55
          - gemini4argon
      condition:
        description: Global guideline condition
        type: choice
        default: no_guidelines
        options: [no_guidelines, with_guidelines]

permissions:
  contents: read

jobs:
  decisions:
    if: github.ref == 'refs/heads/main' && inputs.model != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJSON(inputs.model == 'all' && '["jev","drex2","clefomni","mercurydecide","liquidd1","microsoftdecision1","decider11","solardecideflash","classify1","luna6","sol61","opus55","gemini4argon"]' || format('["{0}"]', inputs.model)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install Bun
        run: npm install -g bun@1.3.8
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify accepted bank and archived evidence
        run: |
          bun run decisions validate
          node verification/decisions/verify.mjs
      - name: Run three matched question permutations
        env:
          CONVEX_EVAL_URL: ${{ secrets.CONVEX_EVAL_URL }}
          CONVEX_AUTH_TOKEN: ${{ secrets.CONVEX_AUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DECISION_MODEL: ${{ matrix.model }}
          DECISION_CONDITION: ${{ inputs.condition }}
          DECISION_OUTPUT: output-decisions-ci
        run: bun run runner/decisions/ci.ts
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decision-${{ matrix.model }}-${{ inputs.condition }}
          path: output-decisions-ci/
          if-no-files-found: warn
          retention-days: 30
